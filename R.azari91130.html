<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Reza Azari</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial;-webkit-tap-highlight-color:transparent;}

:root{
  --bg:#050505;
  --card-bg:rgba(255,255,255,.08);
  --card-border:rgba(255,255,255,.18);
  --text:#ffffff;
  --text-dim:rgba(255,255,255,.65);
  --footer-dim:rgba(255,255,255,.5);
  --glow1:#1e3a8a55;
  --glow2:#2563eb44;
  --ctrl-bg:rgba(255,255,255,.1);
  --ctrl-border:rgba(255,255,255,.25);
  --modal-bg:rgba(30,30,35,.75);
}

body[data-theme="light"]{
  --bg:#eef1f6;
  --card-bg:rgba(255,255,255,.55);
  --card-border:rgba(255,255,255,.6);
  --text:#0b0b0f;
  --text-dim:rgba(0,0,0,.6);
  --footer-dim:rgba(0,0,0,.45);
  --glow1:#93c5fd66;
  --glow2:#60a5fa55;
  --ctrl-bg:rgba(255,255,255,.55);
  --ctrl-border:rgba(0,0,0,.12);
  --modal-bg:rgba(255,255,255,.75);
}

body{
  min-height:100vh;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;position:relative;
  background:var(--bg);
  color:var(--text);
  transition:background .5s ease,color .5s ease;
}

body::before{
  content:"";position:absolute;width:700px;height:700px;
  background:radial-gradient(circle,var(--glow1),transparent 60%);
  top:-250px;left:-200px;
  animation:move 12s infinite alternate ease-in-out;
  transition:background .5s ease;
}
body::after{
  content:"";position:absolute;width:600px;height:600px;
  background:radial-gradient(circle,var(--glow2),transparent 60%);
  bottom:-250px;right:-200px;
  animation:move2 15s infinite alternate ease-in-out;
  transition:background .5s ease;
}
@keyframes move{from{transform:translate(0,0);}to{transform:translate(150px,120px);}}
@keyframes move2{from{transform:translate(0,0);}to{transform:translate(-120px,-100px);}}

/* Top-left control bar */
.top-controls{
  position:fixed;
  top:20px;
  inset-inline-start:20px;
  z-index:50;
  display:flex;
  gap:10px;
}
.ctrl-btn{
  width:46px;height:46px;
  border-radius:50%;
  background:var(--ctrl-bg);
  border:1px solid var(--ctrl-border);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .4s ease, border-color .4s ease;
}
.ctrl-btn:active{transform:scale(.88);}
.ctrl-btn svg{width:20px;height:20px;min-width:20px;min-height:20px;flex-shrink:0;stroke:var(--text);fill:none;transition:stroke .4s ease, opacity .3s ease;}
.ctrl-btn .sun{display:none;}
body[data-theme="light"] .ctrl-btn .moon{display:none;}
body[data-theme="light"] .ctrl-btn .sun{display:block;}

/* Language modal */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .35s ease;
  z-index:100;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}

.lang-modal{
  width:280px;
  background:var(--modal-bg);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  border-radius:24px;
  border:1px solid var(--ctrl-border);
  box-shadow:0 25px 60px rgba(0,0,0,.4);
  padding:10px;
  transform:translateY(30px) scale(.9);
  opacity:0;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
}
.modal-overlay.open .lang-modal{
  transform:translateY(0) scale(1);
  opacity:1;
}
.lang-title{
  text-align:center;
  font-size:13px;
  color:var(--text-dim);
  padding:10px 0 6px;
  letter-spacing:.5px;
}
.lang-option{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border-radius:14px;
  cursor:pointer;
  color:var(--text);
  font-size:15px;
  transition:background .2s ease, transform .15s ease;
}
.lang-option:active{transform:scale(.97);}
.lang-option:hover{background:rgba(120,140,255,.15);}
.lang-option.active{background:rgba(37,99,235,.25);font-weight:600;}
.lang-flag{font-size:20px;}
.lang-divider{height:1px;background:var(--ctrl-border);margin:2px 6px;}

/* Card */
.card{
  position:relative;z-index:2;
  width:90%;max-width:390px;
  padding:38px 25px;
  text-align:center;
  background:var(--card-bg);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-radius:35px;
  border:1px solid var(--card-border);
  box-shadow:0 30px 80px rgba(0,0,0,.5);
  animation:show .8s ease;
  transition:background .5s ease, border-color .5s ease;
}
@keyframes show{from{opacity:0;transform:translateY(40px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}

.profile-box{position:relative;display:inline-block;}
.profile-box::before{
  content:"";position:absolute;inset:-8px;border-radius:50%;
  background:linear-gradient(45deg,#2563eb,#ffffff,#1e40af);
  filter:blur(12px);opacity:.7;
  animation:rotate 5s linear infinite;
}
@keyframes rotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.profile{
  position:relative;width:135px;height:135px;border-radius:50%;
  object-fit:cover;border:3px solid rgba(255,255,255,.8);
  box-shadow:0 15px 40px rgba(0,0,0,.6);
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-user-drag:none;
  user-drag:none;
  touch-action:manipulation;
}

.name-row{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-top:22px;
}
h1{font-size:30px;letter-spacing:1px;}
.app-icon{
  width:26px;height:26px;border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.text{margin-top:8px;font-size:15px;color:var(--text-dim);letter-spacing:.5px;transition:color .5s ease;}

button{
  width:100%;height:58px;margin-top:18px;border:none;border-radius:20px;
  color:white;font-size:17px;font-weight:600;cursor:pointer;
  display:flex;justify-content:center;align-items:center;gap:10px;
  transition:.2s;box-shadow:0 10px 25px rgba(0,0,0,.35);
}
button svg{width:22px;height:22px;flex-shrink:0;min-width:22px;min-height:22px;}
button:active{transform:scale(.94);}

.instagram{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);}
.telegram{background:#229ED9;}
.phone{background:#16a34a;}

.footer{margin-top:25px;font-size:12px;color:var(--footer-dim);transition:color .5s ease;}
</style>
</head>

</div>

<script>
const translations = {
  fa:{dir:"rtl",chooseLang:"انتخاب زبان",subtitle:"پروفایل شخصی",instagram:"اینستاگرام",telegram:"تلگرام",call:"تماس بگیرید",footerName:"رضا آذری"},
  en:{dir:"ltr",chooseLang:"Choose Language",subtitle:"Personal Profile",instagram:"Instagram",telegram:"Telegram",call:"Call Me",footerName:"Reza Azari"},
  ar:{dir:"rtl",chooseLang:"اختر اللغة",subtitle:"الملف الشخصي",instagram:"انستغرام",telegram:"تيليجرام",call:"اتصل بي",footerName:"رضا عذاری"},
  de:{dir:"ltr",chooseLang:"Sprache wählen",subtitle:"Persönliches Profil",instagram:"Instagram",telegram:"Telegram",call:"Anrufen",footerName:"Reza Azari"},
  fr:{dir:"ltr",chooseLang:"Choisir la langue",subtitle:"Profil Personnel",instagram:"Instagram",telegram:"Telegram",call:"Appelez-moi",footerName:"Reza Azari"}
};

function applyLang(lang){
  const t = translations[lang];
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', t.dir);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(t[key]) el.textContent = t[key];
  });
  document.querySelectorAll('.lang-option').forEach(opt=>{
    opt.classList.toggle('active', opt.getAttribute('data-lang')===lang);
  });
  localStorage.setItem('siteLang', lang);
}

function applyTheme(theme){
  document.body.setAttribute('data-theme', theme);
  localStorage.setItem('siteTheme', theme);
}

// init
const savedLang = 'fa';
const savedTheme = 'dark';
applyLang(savedLang);
applyTheme(savedTheme);

document.getElementById('themeToggle').onclick = function(){
  const current = document.body.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
};

const langOverlay = document.getElementById('langOverlay');
document.getElementById('langToggle').onclick = function(){
  langOverlay.classList.add('open');
};
langOverlay.onclick = function(e){
  if(e.target === langOverlay) langOverlay.classList.remove('open');
};
document.querySelectorAll('.lang-option').forEach(opt=>{
  opt.onclick = function(){
    applyLang(this.getAttribute('data-lang'));
    setTimeout(()=>langOverlay.classList.remove('open'), 200);
  };
});

document.getElementById("instagram").onclick=function(){
  window.location.href="instagram://user?username=r.azari.9113";
}
document.getElementById("telegram").onclick=function(){
  window.location.href="tg://resolve?domain=AL_LTO_ONE";
}
document.getElementById("phone").onclick=function(){
  window.location.href="tel:+989938435526";
}
</script>
